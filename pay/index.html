<!doctype html>
<!--
  La page du lien de carte. Un fichier fixe, hors de la chaîne build*.py : elle
  ne vit que par un lien privé envoyé après confirmation, et n'est ni indexée ni
  au plan du site. Elle n'a aucun secret : tout passe par la fonction `payer`.

  Pourquoi une page devant la fonction, et pas la fonction dans le message :
  — la cliente lit petit-gateau.com, pas une adresse Google qu'elle ne connaît pas ;
  — WhatsApp ouvre les liens pour en faire un aperçu. Un robot ne lance pas de
    JavaScript : il ne peut donc pas créer un paiement à sa place.

  Anglais seul pour l'instant : le lien ne part qu'aux commandes en anglais tant
  que Doha n'a pas validé l'arabe (`cfm_card`, libelles-message.json).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Petit Gâteau · Payment</title>
<style>
@font-face{font-family:Figtree;font-weight:400;font-display:swap;src:url(/fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;font-weight:700;font-display:swap;src:url(/fonts/figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-weight:700;font-display:swap;src:url(/fonts/fraunces-latin-700-normal.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FAF6EC;color:#5E1622;font:400 17px/1.55 Figtree,system-ui,sans-serif;text-align:center}
main{max-width:420px}
.marque{font:700 22px/1.18 Fraunces,Georgia,serif;letter-spacing:-.005em;margin:0 0 28px}
h1{font:700 30px/1.18 Fraunces,Georgia,serif;letter-spacing:-.005em;margin:0 0 12px}
p{margin:0 0 20px}
a.action{display:inline-block;min-height:48px;padding:12px 28px;border-radius:999px;background:#2E5A3E;color:#fff;font-weight:700;text-decoration:none}
a.action[hidden]{display:none}
</style>
</head>
<body>
<main>
  <p class="marque">Petit Gâteau</p>
  <h1 id="titre">One moment…</h1>
  <p id="texte">Opening the secure payment page.</p>
  <a class="action" id="action" hidden href="https://wa.me/97450040617">Message us on WhatsApp</a>
</main>
<script>
(function(){
  var FONCTION = 'https://me-central1-petit-gateau-ab7de.cloudfunctions.net/payer';
  var q = String(location.search);
  // Une expression plutôt que URLSearchParams : SkipCash ajoute ses paramètres
  // au retour, et on ne sait pas s'il respecte le « ? » déjà présent.
  var m = q.match(/[?&]c=([A-Za-z0-9_-]{20,40})/);
  var retour = /[?&]retour=1/.test(q);
  var erreur = /[?&]erreur=1/.test(q);
  function dire(titre, texte, bouton, cible){
    document.getElementById('titre').textContent = titre;
    document.getElementById('texte').textContent = texte;
    var a = document.getElementById('action');
    a.hidden = !bouton;
    if(bouton){ a.textContent = bouton; if(cible) a.href = cible; }
  }
  var INVALIDE = ['This link is no longer valid', 'Message us and we’ll sort it out.', 'Message us on WhatsApp'];
  // Seulement quand la fonction a dit « payé » : ce message affirme un paiement.
  var DIRE_PAYE = document.getElementById('action').href + '?text=' + encodeURIComponent('Hi! I’ve just paid for my order by card. Thank you!');
  if(!m){ dire.apply(null, INVALIDE); return; }
  var payer = FONCTION + '?c=' + m[1];
  if(!retour){ location.replace(payer); return; }
  if(erreur){
    dire('Card payment isn’t available right now', 'Nothing was charged. Try again in a moment, or pay by Fawran.', 'Try again', location.pathname + '?c=' + m[1]);
    return;
  }
  fetch(payer + '&etat=1', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(p){
    if(p.statut === 'payee') dire('Thank you', 'Your payment is received. We’ll see you with your order.', 'Message us on WhatsApp', DIRE_PAYE);
    else if(p.statut === 'en-cours') dire('Almost there', 'Your payment is still being confirmed. If you completed it, there’s nothing more to do.', 'Back to payment', location.pathname + '?c=' + m[1]);
    else if(p.statut === 'a-payer' || p.statut === 'echouee' || p.statut === 'rejetee') dire('Payment not completed', 'Nothing was charged. You can try again.', 'Try again', location.pathname + '?c=' + m[1]);
    else if(p.statut === 'ecart') dire('Thank you', 'We received your payment and will check it with you on WhatsApp.', 'Message us on WhatsApp', DIRE_PAYE);
    else dire.apply(null, INVALIDE);
  }).catch(function(){
    dire('We couldn’t check your payment', 'If you completed it, it’s safe: we’ll confirm on WhatsApp.', 'Message us on WhatsApp');
  });
})();
</script>
</body>
</html>
